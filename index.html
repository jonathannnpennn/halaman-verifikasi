<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080808" />

  <title>Verifikasi Keamanan</title>

  <style>
    :root {
      --black: #080808;
      --black-soft: #111111;
      --panel: rgba(22, 22, 22, .88);
      --gold: #d9a441;
      --gold-light: #ffe08a;
      --gold-dark: #9b6a13;
      --white: #fffaf0;
      --muted: #b7b0a1;
      --line: rgba(217, 164, 65, .28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      color: var(--white);
      font-family: Inter, Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% -10%, rgba(217, 164, 65, .16), transparent 34%),
        radial-gradient(circle at 0% 100%, rgba(217, 164, 65, .10), transparent 30%),
        var(--black);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      opacity: .08;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.1) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    .orb {
      position: fixed;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(50px);
      opacity: .15;
      background: var(--gold);
      animation: floatOrb 8s ease-in-out infinite;
    }

    .orb-one {
      top: -150px;
      right: -80px;
    }

    .orb-two {
      bottom: -160px;
      left: -100px;
      animation-delay: -3s;
    }

    .card {
      position: relative;
      width: min(100%, 530px);
      padding: 46px 34px 34px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 28px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.055), transparent 35%),
        var(--panel);
      box-shadow:
        0 25px 90px rgba(0, 0, 0, .7),
        0 0 60px rgba(217, 164, 65, .08),
        inset 0 1px 0 rgba(255, 255, 255, .08);
      backdrop-filter: blur(18px);
      animation: cardIn .8s cubic-bezier(.2,.8,.2,1) both;
    }

    .card::before,
    .card::after {
      content: "";
      position: absolute;
      width: 90px;
      height: 90px;
      border-color: var(--gold);
      opacity: .7;
      pointer-events: none;
    }

    .card::before {
      top: 18px;
      left: 18px;
      border-top: 1px solid;
      border-left: 1px solid;
      border-radius: 12px 0 0 0;
    }

    .card::after {
      right: 18px;
      bottom: 18px;
      border-right: 1px solid;
      border-bottom: 1px solid;
      border-radius: 0 0 12px 0;
    }

    .brand {
      margin-bottom: 27px;
      color: var(--gold-light);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .security-icon {
      position: relative;
      width: 94px;
      height: 94px;
      display: grid;
      place-items: center;
      margin: 0 auto 25px;
      border: 1px solid rgba(217, 164, 65, .45);
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(217,164,65,.2), transparent 66%),
        #17130c;
      box-shadow:
        0 0 0 9px rgba(217, 164, 65, .045),
        0 0 36px rgba(217, 164, 65, .18);
      animation: iconPulse 3s ease-in-out infinite;
    }

    .security-icon::before {
      content: "";
      position: absolute;
      inset: -9px;
      border: 1px dashed rgba(217, 164, 65, .32);
      border-radius: 50%;
      animation: rotate 12s linear infinite;
    }

    .shield {
      position: relative;
      width: 33px;
      height: 40px;
      border: 3px solid var(--gold-light);
      border-radius: 48% 48% 54% 54%;
      clip-path: polygon(50% 0, 94% 15%, 88% 64%, 50% 100%, 12% 64%, 6% 15%);
      background: linear-gradient(145deg, rgba(255,224,138,.25), transparent);
    }

    .shield::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 7px;
      left: 6px;
      top: 12px;
      border-left: 3px solid var(--gold-light);
      border-bottom: 3px solid var(--gold-light);
      transform: rotate(-45deg);
    }

    h1 {
      margin-bottom: 14px;
      color: var(--white);
      font-size: clamp(26px, 6vw, 34px);
      letter-spacing: -.8px;
    }

    .subtitle {
      max-width: 400px;
      margin: 0 auto 27px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
    }

    .divider {
      width: 80px;
      height: 2px;
      margin: 0 auto 27px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .continue-button {
      position: relative;
      width: 100%;
      min-height: 61px;
      overflow: hidden;
      border: 1px solid var(--gold-light);
      border-radius: 13px;
      color: #171008;
      background: linear-gradient(135deg, var(--gold-light), var(--gold), #b47b1d);
      box-shadow:
        0 10px 25px rgba(217, 164, 65, .22),
        inset 0 1px 0 rgba(255,255,255,.55);
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .continue-button:disabled {
      filter: grayscale(0.5) brightness(0.8);
      cursor: not-allowed;
      transform: none;
    }

    .continue-button::before {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 70%;
      height: 100%;
      transform: skewX(-22deg);
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, .55),
        transparent
      );
      transition: left .7s ease;
    }

    .continue-button:hover {
      transform: translateY(-3px);
      filter: brightness(1.08);
      box-shadow:
        0 16px 32px rgba(217, 164, 65, .30),
        0 0 22px rgba(217, 164, 65, .18);
    }

    .continue-button:hover::before {
      left: 145%;
    }

    .continue-button:active {
      transform: translateY(0) scale(.98);
    }

    .continue-button:focus-visible {
      outline: 3px solid var(--white);
      outline-offset: 4px;
    }

    .button-content {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
    }

    .arrow {
      font-size: 23px;
      transition: transform .2s ease;
    }

    .continue-button:hover .arrow {
      transform: translateX(5px);
    }

    .spinner {
      display: none;
      width: 19px;
      height: 19px;
      border: 3px solid rgba(0,0,0,.28);
      border-top-color: #171008;
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }

    .loading {
      pointer-events: none;
      filter: brightness(.92);
    }

    .loading .spinner {
      display: inline-block;
    }

    .loading .button-text {
      font-size: 0;
    }

    .loading .button-text::after {
      content: "Memverifikasi...";
      font-size: 18px;
    }

    .loading .arrow {
      display: none;
    }

    .status {
      min-height: 21px;
      margin-top: 17px;
      color: var(--gold-light);
      font-size: 13px;
      opacity: 0;
      transition: opacity .3s ease;
    }

    .status.show {
      opacity: 1;
    }

    .status.error {
      color: #ff4d4d;
    }

    .notice {
      margin-top: 22px;
      color: #8e887c;
      font-size: 12px;
      line-height: 1.7;
    }

    .notice a {
      color: var(--gold-light);
      text-decoration: none;
    }

    .notice a:hover {
      text-decoration: underline;
    }

    .footer-mark {
      margin-top: 27px;
      color: #6d675d;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(28px) scale(.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes iconPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow:
          0 0 0 9px rgba(217, 164, 65, .045),
          0 0 36px rgba(217, 164, 65, .18);
      }
      50% {
        transform: scale(1.045);
        box-shadow:
          0 0 0 14px rgba(217, 164, 65, .025),
          0 0 48px rgba(217, 164, 65, .28);
      }
    }

    @keyframes rotate {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes floatOrb {
      0%, 100% {
        transform: translate(0, 0);
      }
      50% {
        transform: translate(18px, -25px);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 37px 22px 28px;
        border-radius: 22px;
      }

      .brand {
        font-size: 10px;
        letter-spacing: 3px;
      }

      .subtitle {
        font-size: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="orb orb-one"></div>
  <div class="orb orb-two"></div>

  <main class="card" aria-labelledby="pageTitle">
    <div class="brand">Secure Access</div>

    <div class="security-icon" aria-hidden="true">
      <div class="shield"></div>
    </div>

    <h1 id="pageTitle">Verifikasi Keamanan</h1>

    <p class="subtitle">
      Pastikan Anda adalah pengguna yang sah untuk melanjutkan
      ke halaman berikutnya.
    </p>

    <div class="divider"></div>

    <!-- HONEYPOT FIELDS: Multiple hidden fields to catch bots -->
    <input type="text" id="honeypot-website" name="website" style="display:none !important" tabindex="-1" autocomplete="off" aria-hidden="true">
    <input type="text" id="honeypot-email" name="email" style="display:none !important" tabindex="-1" autocomplete="off" aria-hidden="true">
    <input type="text" id="honeypot-phone" name="phone" style="display:none !important" tabindex="-1" autocomplete="off" aria-hidden="true">
    <input type="text" id="honeypot-username" name="username" style="display:none !important" tabindex="-1" autocomplete="off" aria-hidden="true">

    <button
      class="continue-button"
      id="continueButton"
      type="button"
      aria-label="Melanjutkan proses verifikasi"
    >
      <span class="button-content">
        <span class="spinner" aria-hidden="true"></span>
        <span class="button-text">Melanjutkan</span>
        <span class="arrow" aria-hidden="true">→</span>
      </span>
    </button>

    <div
      class="status"
      id="statusMessage"
      role="status"
      aria-live="polite"
    >
      Verifikasi berhasil. Mengarahkan Anda...
    </div>

    <p class="notice">
      Dengan melanjutkan, Anda menyetujui
      <a href="#">Kebijakan Privasi</a>
      dan
      <a href="#">Persyaratan Layanan</a>.
    </p>

    <div class="footer-mark">Protected Connection</div>
  </main>

  <!-- Canvas untuk fingerprinting (tersembunyi) -->
  <canvas id="fingerprintCanvas" style="display:none;" width="200" height="50"></canvas>

  <script>
    const TUJUAN_URL = "https://pafimalang.org/register?referral=jonathannn";

    const button = document.getElementById("continueButton");
    const statusMessage = document.getElementById("statusMessage");
    const honeypots = [
      document.getElementById("honeypot-website"),
      document.getElementById("honeypot-email"),
      document.getElementById("honeypot-phone"),
      document.getElementById("honeypot-username")
    ];

    // === TRACKING VARIABLES ===
    const pageLoadTime = Date.now();
    const mouseMovements = [];
    const keyPressTimes = [];
    const touchEvents = [];
    let hasMouseMovement = false;
    let hasKeyboardInteraction = false;
    let hasTouchInteraction = false;
    let mouseEnterTime = null;

    // === MOUSE TRACKING ===
    document.addEventListener('mousemove', function(e) {
      hasMouseMovement = true;
      const now = Date.now();
      mouseMovements.push({
        x: e.clientX,
        y: e.clientY,
        time: now - pageLoadTime,
        timestamp: now
      });
      
      // Batasi array agar tidak terlalu besar
      if (mouseMovements.length > 100) {
        mouseMovements.shift();
      }
    });

    // Track mouse enter pada button
    button.addEventListener('mouseenter', function() {
      mouseEnterTime = Date.now();
    });

    // === KEYBOARD TRACKING ===
    document.addEventListener('keydown', function(e) {
      hasKeyboardInteraction = true;
      keyPressTimes.push(Date.now() - pageLoadTime);
      
      if (keyPressTimes.length > 50) {
        keyPressTimes.shift();
      }
    });

    // === TOUCH TRACKING ===
    document.addEventListener('touchstart', function(e) {
      hasTouchInteraction = true;
      touchEvents.push({
        time: Date.now() - pageLoadTime,
        touches: e.touches.length
      });
      
      if (touchEvents.length > 50) {
        touchEvents.shift();
      }
    });

    document.addEventListener('touchmove', function(e) {
      hasTouchInteraction = true;
    });

    // === SCROLL TRACKING ===
    let hasScrollInteraction = false;
    document.addEventListener('scroll', function() {
      hasScrollInteraction = true;
    }, { passive: true });

    // === CANVAS FINGERPRINTING ===
    function getCanvasFingerprint() {
      try {
        const canvas = document.getElementById('fingerprintCanvas');
        const ctx = canvas.getContext('2d');
        
        // Render text dengan berbagai properti
        ctx.textBaseline = 'top';
        ctx.font = '14px Arial';
        ctx.fillStyle = '#f60';
        ctx.fillRect(0, 0, 100, 50);
        ctx.fillStyle = '#069';
        ctx.fillText('🔒 Security Check', 2, 15);
        ctx.fillStyle = 'rgba(102, 204, 0, 0.7)';
        ctx.fillText('🔒 Security Check', 4, 17);
        
        // Dapatkan data pixel untuk fingerprint
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        
        // Hitung hash sederhana
        let hash = 0;
        for (let i = 0; i < data.length; i += 4) {
          hash = ((hash << 5) - hash) + data[i] + data[i+1] + data[i+2];
          hash = hash & hash;
        }
        
        return hash.toString(16);
      } catch (e) {
        return 'error';
      }
    }

    // === DETEKSI HEADLESS BROWSER ===
    function detectHeadlessBrowser() {
      const checks = {
        // Cek webdriver
        webdriver: navigator.webdriver === true,
        
        // Cek properties yang biasanya tidak ada di browser normal
        phantom: typeof window._phantom !== 'undefined',
        callPhantom: typeof window.callPhantom === 'function',
        
        // Cek apakah ini Selenium
        selenium: (function() {
          const drivers = ['__webdriver_evaluate', '__selenium_evaluate', '__fxdriver_evaluate',
                          '__driver_unwrapped', '__webdriver_unwrapped', '__driver_evaluate',
                          '__selenium_unwrapped', '__fxdriver_unwrapped'];
          return drivers.some(prop => prop in document);
        })(),
        
        // Cek apakah ini Puppeteer
        puppeteer: (function() {
          try {
            return Object.keys(window).some(key => 
              key.includes('puppeteer') || key.includes('devtools')
            );
          } catch (e) {
            return false;
          }
        })(),
        
        // Cek console debug (headless browsers sering punya quirks)
        chrome: navigator.userAgent.includes('Chrome') && 
                !navigator.userAgent.includes('HeadlessChrome'),
        
        // Cek plugins (bot biasanya tidak punya plugins)
        noPlugins: navigator.plugins.length === 0 && 
                   navigator.userAgent.includes('Chrome'),
        
        // Cek languages (bot sering tidak set ini)
        noLanguages: !navigator.languages || navigator.languages.length === 0,
        
        // Cek timezone
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone === 'UTC' &&
                  navigator.userAgent.includes('Chrome'),
      };
      
      // Hitung skor kecurigaan
      const suspiciousCount = Object.values(checks).filter(v => v).length;
      return {
        checks,
        isSuspicious: suspiciousCount >= 2,
        score: suspiciousCount
      };
    }

    // === ANALISIS POLA MOUSE ===
    function analyzeMousePattern() {
      if (mouseMovements.length < 3) {
        return { isHuman: false, reason: 'Too few movements' };
      }
      
      // Hitung variasi kecepatan (manusia punya variasi, bot linear)
      const speeds = [];
      for (let i = 1; i < mouseMovements.length; i++) {
        const dx = mouseMovements[i].x - mouseMovements[i-1].x;
        const dy = mouseMovements[i].y - mouseMovements[i-1].y;
        const dt = mouseMovements[i].time - mouseMovements[i-1].time;
        
        if (dt > 0) {
          speeds.push(Math.sqrt(dx*dx + dy*dy) / dt);
        }
      }
      
      if (speeds.length < 2) {
        return { isHuman: false, reason: 'Cannot calculate speed variance' };
      }
      
      // Hitung standar deviasi kecepatan
      const avgSpeed = speeds.reduce((a, b) => a + b, 0) / speeds.length;
      const variance = speeds.reduce((a, b) => a + Math.pow(b - avgSpeed, 2), 0) / speeds.length;
      const stdDev = Math.sqrt(variance);
      
      // Manusia punya variasi kecepatan yang signifikan
      const hasNaturalVariation = stdDev > 0.5 || avgSpeed > 5;
      
      return {
        isHuman: hasNaturalVariation,
        avgSpeed,
        stdDev,
        reason: hasNaturalVariation ? 'Natural variation detected' : 'Too linear movement'
      };
    }

    // === SCREEN/BROWSER CONSISTENCY CHECK ===
    function checkScreenConsistency() {
      const ua = navigator.userAgent.toLowerCase();
      const isMobile = /mobile|android|iphone|ipad/i.test(ua);
      const isTablet = /tablet|ipad/i.test(ua);
      const isDesktop = !isMobile && !isTablet;
      
      const screenWidth = window.screen.width;
      const screenHeight = window.screen.height;
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;
      
      const issues = [];
      
      // Cek konsistensi resolusi
      if (isDesktop && (screenWidth < 800 || screenHeight < 600)) {
        issues.push('Unusual desktop resolution');
      }
      
      if (isMobile && (screenWidth > 500 || screenHeight > 900)) {
        issues.push('Resolution inconsistent with mobile UA');
      }
      
      // Cek apakah window size masuk akal
      if (windowWidth > screenWidth || windowHeight > screenHeight) {
        issues.push('Window larger than screen');
      }
      
      return {
        isConsistent: issues.length === 0,
        issues,
        screen: { width: screenWidth, height: screenHeight },
        window: { width: windowWidth, height: windowHeight }
      };
    }

    // === FUNGSI DETEKSI BOT UTAMA ===
    function isBot(event) {
      const detectionResults = {
        honeypot: false,
        eventTrusted: true,
        webdriver: false,
        languages: true,
        timing: true,
        interaction: true,
        headless: { isSuspicious: false, score: 0 },
        mousePattern: { isHuman: true },
        screenConsistency: { isConsistent: true },
        canvas: true
      };
      
      // 1. Cek Honeypot
      const honeypotFilled = honeypots.some(hp => hp && hp.value !== "");
      detectionResults.honeypot = honeypotFilled;
      if (honeypotFilled) {
        console.warn("🚨 Bot terdeteksi: Honeypot terisi.");
        return { isBot: true, reason: 'honeypot', details: detectionResults };
      }

      // 2. Cek event trustworthiness
      if (event && !event.isTrusted) {
        detectionResults.eventTrusted = false;
        console.warn("🚨 Bot terdeteksi: Klik tidak terpercaya (isTrusted=false).");
        return { isBot: true, reason: 'untrusted_event', details: detectionResults };
      }

      // 3. Cek WebDriver
      if (navigator.webdriver) {
        detectionResults.webdriver = true;
        console.warn("🚨 Bot terdeteksi: WebDriver aktif.");
        return { isBot: true, reason: 'webdriver', details: detectionResults };
      }

      // 4. Cek bahasa browser
      if (!navigator.languages || navigator.languages.length === 0) {
        detectionResults.languages = false;
        console.warn("🚨 Bot terdeteksi: Tidak ada preferensi bahasa.");
        return { isBot: true, reason: 'no_languages', details: detectionResults };
      }

      // 5. Cek waktu minimum (terlalu cepat = bot)
      const timeElapsed = Date.now() - pageLoadTime;
      if (timeElapsed < 1500) {
        detectionResults.timing = false;
        console.warn("🚨 Bot terdeteksi: Klik terlalu cepat (" + timeElapsed + "ms).");
        return { isBot: true, reason: 'too_fast', details: detectionResults };
      }

      // 6. Cek interaksi minimal (harus ada minimal 1 jenis interaksi)
      const hasAnyInteraction = hasMouseMovement || hasKeyboardInteraction || 
                                hasTouchInteraction || hasScrollInteraction;
      if (!hasAnyInteraction) {
        detectionResults.interaction = false;
        console.warn("🚨 Bot terdeteksi: Tidak ada interaksi sama sekali.");
        return { isBot: true, reason: 'no_interaction', details: detectionResults };
      }

      // 7. Deteksi headless browser
      const headlessCheck = detectHeadlessBrowser();
      detectionResults.headless = headlessCheck;
      if (headlessCheck.isSuspicious) {
        console.warn("🚨 Bot terdeteksi: Headless browser (score: " + headlessCheck.score + ")");
        return { isBot: true, reason: 'headless_browser', details: detectionResults };
      }

      // 8. Analisis pola mouse (jika ada data cukup)
      if (mouseMovements.length >= 3) {
        const mouseAnalysis = analyzeMousePattern();
        detectionResults.mousePattern = mouseAnalysis;
        if (!mouseAnalysis.isHuman) {
          console.warn("🚨 Bot terdeteksi: Pola mouse tidak natural - " + mouseAnalysis.reason);
          return { isBot: true, reason: 'unnatural_mouse', details: detectionResults };
        }
      }

      // 9. Cek konsistensi screen/browser
      const screenCheck = checkScreenConsistency();
      detectionResults.screenConsistency = screenCheck;
      if (!screenCheck.isConsistent) {
        console.warn("🚨 Bot terdeteksi: Inkonsistensi screen/browser - " + screenCheck.issues.join(', '));
        return { isBot: true, reason: 'screen_inconsistency', details: detectionResults };
      }

      // 10. Canvas fingerprint (untuk deteksi headless)
      const canvasFp = getCanvasFingerprint();
      detectionResults.canvas = canvasFp !== 'error';
      if (canvasFp === 'error') {
        console.warn("⚠️ Warning: Canvas rendering error (mungkin headless)");
      }

      // Jika lolos semua pengecekan
      console.log("✅ Verifikasi berhasil - User terlihat seperti manusia");
      return { isBot: false, reason: 'passed', details: detectionResults };
    }

    // === EVENT LISTENER UNTUK BUTTON ===
    button.addEventListener("click", function (event) {
      const detection = isBot(event);
      
      if (detection.isBot) {
        // Tampilkan pesan error
        statusMessage.textContent = "⛔ Akses ditolak. Aktivitas mencurigakan terdeteksi.";
        statusMessage.classList.add("show", "error");
        
        // Alihkan bot ke Google setelah 2 detik
        setTimeout(() => {
          window.location.href = "https://www.google.com"; 
        }, 2000);
        return;
      }

      // === JIKA LOLOS PENGECEKAN (MANUSIA ASLI) ===
      button.classList.add("loading");
      statusMessage.classList.add("show");
      statusMessage.classList.remove("error");
      statusMessage.textContent = "✅ Verifikasi berhasil. Mengarahkan Anda...";

      // Waktu animasi sebelum berpindah halaman
      setTimeout(function () {
        window.location.href = TUJUAN_URL;
      }, 1600);
    });

    // === LOGGING UNTUK DEBUGGING (opsional, bisa dihapus di production) ===
    window.addEventListener('load', function() {
      console.log("🔒 Security Page Loaded");
      console.log("📊 Detection ready - Mouse movements:", mouseMovements.length);
      console.log("🎨 Canvas fingerprint:", getCanvasFingerprint());
      console.log("🖥️ Screen consistency:", checkScreenConsistency());
    });

    // Log status setiap 5 detik (untuk monitoring)
    setInterval(function() {
      if (window.location.href.includes(window.location.origin)) {
        console.log("📈 Status:", {
          mouseMovements: mouseMovements.length,
          keyPresses: keyPressTimes.length,
          touchEvents: touchEvents.length,
          hasInteraction: hasMouseMovement || hasKeyboardInteraction || hasTouchInteraction
        });
      }
    }, 5000);
  </script>
</body>
</html>
